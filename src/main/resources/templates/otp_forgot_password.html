<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Xác thực quên mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; background: #fff5f5; padding: 30px;">

<!-- Header -->
<div style="text-align: center; margin-bottom: 20px;">
    <h1 style="
        color: #A00000;
        font-size: 36px;
        letter-spacing: 1px;
        margin: 0;
    ">BloodLink</h1>
    <p style="
        color: #555;
        font-size: 14px;
        margin-top: 5px;
    ">Hệ thống hiến máu tình nguyện</p>
</div>

<!-- Nội dung chính -->
<div style="
    max-width: 600px;
    margin: auto;
    background: #ffffff;
    padding: 40px 30px;
    border-radius: 14px;
    box-shadow: 0 8px 20px rgba(160, 0, 0, 0.15);
    text-align: center;
">
    <h2 style="
        color: #A00000;
        margin-bottom: 20px;
    ">Xác thực quên mật khẩu</h2>

    <p style="
        font-size: 16px;
        color: #555;
        line-height: 1.6;
    ">
        Đây là mã OTP để đặt lại mật khẩu của bạn. Vui lòng không chia sẻ mã này cho bất kỳ ai.
    </p>

    <div style="
        display: inline-block;
        margin: 30px 0;
        padding: 14px 32px;
        font-size: 28px;
        font-weight: bold;
        color: #ffffff;
        background: #D32F2F;
        border-radius: 8px;
        letter-spacing: 2px;
    ">
        ${otp}
    </div>

    <p style="
        font-size: 14px;
        color: #888;
        margin-top: 30px;
    ">
        Nếu bạn không yêu cầu OTP này, vui lòng bỏ qua email này.
    </p>
</div>

<!-- Footer -->
<div style="
    max-width: 600px;
    margin: 40px auto 0;
    text-align: center;
    font-size: 13px;
    color: #777;
">
    <hr style="border: none; border-top: 1px solid #ddd; margin: 20px 0;">
    <p style="margin: 5px 0;">
